default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USERNAME") { ENV["USER"] } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "") %>

development:
  <<: *default
  database: echo_chat_development

test:
  <<: *default
  database: echo_chat_test

production:
  primary:
    <<: *default
<% if ENV["DATABASE_URL"].present? %>
    url: <%= ENV["DATABASE_URL"] %>
<% else %>
    database: echo_chat_production
    username: echo_chat
    password: <%= ENV["ECHO_CHAT_DATABASE_PASSWORD"] %>
<% end %>
